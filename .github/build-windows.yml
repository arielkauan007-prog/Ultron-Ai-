name: Build Ultron IA for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Criar instalador EXE
        run: npm run dist
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-IA-Installer
          path: dist/*.exe
